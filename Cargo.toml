[workspace]
members = [
    "crates/provider-auth",
    "crates/provider-core",
    "crates/provider-drivers",
    "crates/provider-management",
    "crates/provider-protocol",
    "crates/provider-runtime",
    "crates/provider-storage",
    "crates/provider-usage",
    "crates/provider-server",
]
default-members = ["crates/provider-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
argon2 = { version = "0.5.3", default-features = false, features = ["std"] }
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.1"
chacha20poly1305 = "0.10.1"
futures-core = "0.3.32"
futures-util = "0.3.32"
getrandom = "0.4.3"
os_info = "=3.12.0"
provider-auth = { path = "crates/provider-auth" }
provider-core = { path = "crates/provider-core" }
provider-drivers = { path = "crates/provider-drivers" }
provider-management = { path = "crates/provider-management" }
provider-protocol = { path = "crates/provider-protocol" }
provider-runtime = { path = "crates/provider-runtime" }
provider-storage = { path = "crates/provider-storage" }
provider-usage = { path = "crates/provider-usage" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "stream", "form"] }
rcgen = "0.14.5"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
# `raw_value` keeps a JSON number's original digits reachable, so a catalog price
# can be parsed to an exact integer instead of going through `f64` first. Unlike
# `arbitrary_precision` it is purely additive and changes no existing behaviour.
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2.0.18"
tiktoken-rs = "0.12.0"
time = { version = "0.3.53", default-features = false, features = ["formatting", "parsing"] }
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.18", default-features = false, features = ["rt", "time"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.6.11", default-features = false, features = ["fs"] }
uuid = { version = "1.23.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
